name: feedastrolabe
x-app: &app
  build: .
  image: feedastrolabe:local
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  volumes:
    - reader-data:/data
  networks: [reader]
  environment:
    FEEDASTROLABE_ACCESS_MODE: local
  stop_grace_period: 45s
services:
  web:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 20s
  worker:
    <<: *app
    command: [python, -m, flask, --app, feedastrolabe, worker]
    depends_on:
      web:
        condition: service_healthy
volumes:
  reader-data:
networks:
  reader:
