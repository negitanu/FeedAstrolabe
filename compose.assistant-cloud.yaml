# Optional: explicit cloud profile/preview approval still required at runtime.
services:
  web:
    environment:
      FEEDASTROLABE_OLLAMA_TOKEN_FILE: /run/secrets/feedastrolabe_ollama_token
    secrets:
      - feedastrolabe_ollama_token
  worker:
    environment:
      FEEDASTROLABE_OLLAMA_TOKEN_FILE: /run/secrets/feedastrolabe_ollama_token
    secrets:
      - feedastrolabe_ollama_token
secrets:
  feedastrolabe_ollama_token:
    file: ${FEEDASTROLABE_OLLAMA_TOKEN_FILE:-./secrets/ollama-token}
