{% extends 'research_base.html' %}{% from 'relation_form.html' import fields %}{% block research_body %}<h1>{{ workspace.title }} · 関係を記録</h1><p><a href="{{ url_for('entities.relations',workspace=workspace.id) }}">← 関係一覧</a></p>{% if workspace.archived %}<p>この案件はアーカイブ済みです。関係の追加は停止しています。</p>{% else %}<section class="settings-card"><form method="post">{{ token() }}{{ fields() }}<button>根拠付きの関係を保存</button></form></section>{% endif %}{% endblock %}
