<section class="settings-card" id="rss"><p>登録時に初回取得します。登録後は「読む」で記事を確認できます。</p><form method="post" action="{{ url_for('subscribe') }}">{{ token() }}<label for="rss-url">RSS / Atom URL</label><input id="rss-url" name="url" type="url" required maxlength="2048" placeholder="https://example.com/feed.xml" value="{{ submitted.get('url','') }}"><label for="rss-folder">フォルダー</label><input id="rss-folder" name="folder" maxlength="80" value="{{ submitted.get('folder','') }}"><button>登録して記事を読む</button></form></section>
