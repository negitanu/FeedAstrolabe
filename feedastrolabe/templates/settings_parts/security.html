<section class="settings-card" id="watch-settings"><h2>ウォッチ設定</h2><form method="post" action="{{ url_for('security.update',watch_id=card.watch.id) }}">{{ token() }}<input type="hidden" name="expected_revision" value="{{ card.watch.revision }}"><label>製品名<input name="product" value="{{ card.watch.product }}" maxlength="300"></label><label>バージョン<input name="version" value="{{ card.watch.version }}" maxlength="200"></label><label class="checkbox-field"><input type="checkbox" name="enabled" {{ 'checked' if card.watch.enabled }}>監視を有効にする</label><label class="checkbox-field"><input type="checkbox" name="outbound_public" {{ 'checked' if card.watch.outbound_public }}>このCVEが公開済みであることを確認し、識別子送信を許可する</label><button>設定を保存</button></form><p class="hint">製品・バージョンを変更すると、それ以前の適用性判断は履歴に残り現行判断から外れます。</p></section>
