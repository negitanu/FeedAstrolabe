<section id="collection" class="settings-card"><h2>収集と表示</h2><form method="post" action="{{ url_for('settings.save') }}">{{ token() }}
<label for="poll-interval">既定のポーリング間隔（秒）</label><input id="poll-interval" name="poll_interval" type="number" min="60" max="86400" value="{{ config.poll_interval }}" required><p class="hint">60 秒〜24 時間。個別設定のないフィードに適用します。</p>
<label class="check"><input type="checkbox" name="polling_enabled" value="1" {{ 'checked' if config.polling_enabled }}> 定期収集を有効にする</label>
<label for="default-view">ライブラリの初期表示</label><select id="default-view" name="default_view">{% for value,label in [('all','すべての記事'),('unread','未読の記事'),('starred','スター付き')] %}<option value="{{ value }}" {{ 'selected' if config.default_view==value }}>{{ label }}</option>{% endfor %}</select>
<label for="display-timezone">表示タイムゾーン</label><select id="display-timezone" name="display_timezone">{% for value,label in [('UTC','UTC（協定世界時）'),('Asia/Tokyo','JST（日本標準時・UTC+9）')] %}<option value="{{ value }}" {{ 'selected' if config.display_timezone==value }}>{{ label }}</option>{% endfor %}</select><p class="hint">画面の日時に適用します。保存データ・API・出力ファイルと日時の入力条件は UTC のままです。</p>
<label for="rate-limit">API キーごとの上限（回／分）</label><input id="rate-limit" name="api_rate_limit" type="number" min="1" max="1000" value="{{ config.api_rate_limit }}" required><button class="button">設定を保存</button></form></section>
