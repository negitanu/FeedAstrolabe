<section class="settings-card" id="topic-settings"><h2>調査設定を変更</h2><form method="post" action="{{ url_for('social_research.configure',feed_id=topic.id) }}">{{ token() }}<div class="settings-grid"><div><label for="edit-name">分野名</label><input id="edit-name" name="name" value="{{ topic.title }}" maxlength="120" required><label for="edit-folder">フォルダー</label><input id="edit-folder" name="folder" value="{{ topic.folder }}" maxlength="80"></div><div class="social-input-pair"><div><label for="edit-interval">収集間隔（分）</label><input id="edit-interval" name="interval_minutes" type="number" min="15" max="1440" value="{{ topic.poll_interval//60 }}" required></div><div><label for="edit-window">対象期間（時間）</label><input id="edit-window" name="window_hours" type="number" min="1" max="168" value="{{ topic.window_hours }}" required></div></div></div><label class="check"><input type="checkbox" name="enabled" value="1" {{ 'checked' if topic.enabled }}> 定期収集</label><button>設定を保存</button><p class="hint">検索語・サーバーを変える場合は新しい調査として登録してください。削除はこの画面の下部から行えます。</p></form></section>
