<h2 id="watch-settings">観測設定</h2><form method="post" action="{{ url_for('network.update',watch_id=card.watch.id) }}">{{ token() }}<input type="hidden" name="expected_revision" value="{{ card.watch.revision }}"><label>観測間隔（秒）<input name="interval_seconds" type="number" min="3600" max="604800" value="{{ card.watch.interval_seconds }}" required></label><label>メタデータ保存日数<input name="retention_days" type="number" min="7" max="3650" value="{{ card.watch.retention_days }}" required></label><label class="checkbox-field"><input type="checkbox" name="enabled" {{ 'checked' if card.watch.enabled }}>観測を有効にする</label><label class="checkbox-field"><input type="checkbox" name="outbound_public" {{ 'checked' if card.watch.outbound_public }}>この公開識別子のサービスへの送信を許可する</label><p class="hint">元の対象と入力は固定です。対象を変える場合は別のウォッチを作ってください。観測間隔は共有キャッシュ有効時間と取得上限にも制約されます。保存期間は古いネットワークメタデータを対象にし、固定根拠や利用者の固定・引用を削除しません。</p><button>設定を保存</button></form>
