<form method="post" action="{{ url_for('research.create_tag') }}">{{ token() }}<input type="hidden" name="return_to" value="settings-tags"><label for="new-tag">新しいタグ名</label><input id="new-tag" name="name" maxlength="80" required><button>タグを作成</button></form>
{% for t in tags %}<section class="settings-card"><form method="post" action="{{ url_for('research.edit_tag',tag_id=t.id) }}">{{ token() }}<input type="hidden" name="return_to" value="settings-tags"><label for="tag-{{ t.id }}">名称を変更</label><input id="tag-{{ t.id }}" name="name" value="{{ t.name }}" maxlength="80" required><button>名称を保存</button></form></section>{% endfor %}
