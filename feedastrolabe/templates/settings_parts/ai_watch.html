<h2 id="watch-settings">収集設定</h2><form method="post" action="{{ url_for('ai.update',watch_id=card.watch.id) }}">{{ token() }}<input name="expected_revision" type="hidden" value="{{ card.watch.revision }}"><label>収集間隔（秒）<input name="interval_seconds" type="number" value="{{ card.watch.interval_seconds }}" min="3600" max="604800" required></label><label><input type="checkbox" name="enabled" {{ 'checked' if card.watch.enabled }}>収集を有効化</label><label><input type="checkbox" name="outbound_public" {{ 'checked' if card.watch.outbound_public }}>公開検索条件の送信を許可</label><button>設定を保存</button></form>
