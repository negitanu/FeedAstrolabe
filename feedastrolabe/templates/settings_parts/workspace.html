<section class="settings-card" id="workspace-settings"><h2>案件の管理</h2>{% if not item.archived %}<details open><summary>目的・進行状況・公開区分を編集</summary><form method="post" action="{{ url_for('research.edit',workspace_id=item.id) }}">{{ token() }}{{ workspace_fields(item) }}<button>案件を保存</button></form></details>{% endif %}<p class="hint">アーカイブしても記事・フィード・メモは削除しません。関連フィードの収集と記事表示は続きます。</p><form method="post" action="{{ url_for('research.archive',workspace_id=item.id) }}">{{ token() }}<input type="hidden" name="archived" value="{{ 'false' if item.archived else 'true' }}"><button class="{{ 'button' if item.archived else 'secondary' }}">{{ '案件を再開' if item.archived else '案件をアーカイブ' }}</button></form>
</section>
