<section class="settings-card"><details open><summary>Mastodon のアカウントを購読</summary><form method="post" action="{{ url_for('settings.subscribe_social') }}">{{ token() }}<input type="hidden" name="source_type" value="mastodon"><input type="hidden" name="source_kind" value="account"><div class="settings-grid"><div><label for="social-target">ローカルユーザー名</label><input id="social-target" name="target" required maxlength="64" placeholder="ユーザー名（@ は省略可）" value="{{ submitted.get('target','') }}"><label for="social-instance">Mastodon サーバー</label><input id="social-instance" name="instance_url" type="url" placeholder="https://mastodon.social" required value="{{ submitted.get('instance_url','') }}"></div><div><label for="social-folder">フォルダー</label><input id="social-folder" name="folder" maxlength="80" placeholder="SNS" value="{{ submitted.get('folder','') }}"><p class="hint">初回は最近40件まで。以降は差分取得します。公開 API を利用し、認証必須のサーバーは対象外です。</p></div></div><button class="button">SNS を登録</button></form></details></section>
