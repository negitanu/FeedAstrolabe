<section class="settings-card" id="topic-create">
<form method="post" action="{{ url_for('social_research.create') }}">{{ token() }}<div class="settings-grid">
<div><label for="topic-name">分野名</label><input id="topic-name" name="name" maxlength="120" placeholder="AI・機械学習" required value="{{ submitted.get('name','') }}"><label for="topic-provider">SNS</label><select id="topic-provider" name="source_type"><option value="bluesky">Bluesky · キーワード検索</option><option value="mastodon" {{ 'selected' if submitted.get('source_type')=='mastodon' }}>Mastodon · ハッシュタグ</option></select><label for="topic-query">検索語／ハッシュタグ</label><input id="topic-query" name="target" maxlength="200" placeholder="Bluesky: 人工知能 ／ Mastodon: AI, 機械学習" required value="{{ submitted.get('target','') }}"><p class="hint">Mastodon はタグをカンマ区切りで最大3個。# は省略可。Bluesky は検索語や検索構文を指定できます。検索条件は各 SNS へ送信します。</p></div>
<div><label for="topic-instance">Mastodon サーバー（Bluesky は空欄）</label><input id="topic-instance" name="instance_url" type="url" placeholder="https://mastodon.social" value="{{ submitted.get('instance_url','') }}"><label for="topic-folder">フォルダー</label><input id="topic-folder" name="folder" maxlength="80" placeholder="SNS 調査" value="{{ submitted.get('folder','') }}"><div class="social-input-pair"><div><label for="topic-interval">収集間隔（分）</label><input id="topic-interval" name="interval_minutes" type="number" min="15" max="1440" value="{{ submitted.get('interval_minutes','30') }}" required></div><div><label for="topic-window">対象期間（時間）</label><input id="topic-window" name="window_hours" type="number" min="1" max="168" value="{{ submitted.get('window_hours','24') }}" required></div></div><p class="hint">API キー不要。公開 API が認証を要求するサーバーは利用できません。</p></div>
</div><button class="button">調査を登録</button></form></section>
