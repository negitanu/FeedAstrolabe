<h2 id="connectors">外部連携と取得上限</h2>{% for item in settings %}<section class="settings-card"><h3>{{ providers[item.provider].name }}</h3><p><a href="{{ providers[item.provider].license }}" rel="noreferrer noopener">利用条件・帰属</a> · {{ item.budget_day or '未取得' }} の取得 {{ item.requests }}件 · 待機期限 {{ item.cooldown_until|display_time(missing='なし') }}</p><form method="post" action="{{ url_for('security.configure',provider=item.provider) }}">{{ token() }}<input type="hidden" name="expected_revision" value="{{ item.revision }}"><label class="checkbox-field"><input type="checkbox" name="enabled" {{ 'checked' if item.enabled }}>この公開情報連携を有効にする</label><label>1日あたり取得上限<input type="number" min="1" max="1000" name="daily_budget" value="{{ item.daily_budget }}" required></label><label>キャッシュ有効時間（秒）<input type="number" min="3600" max="604800" name="ttl_seconds" value="{{ item.ttl_seconds }}" required></label><button>連携設定を保存</button></form></section>{% endfor %}
