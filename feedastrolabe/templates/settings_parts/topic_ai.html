<section id="topic-ai-settings"><h2>評価観点・自動抽出を設定</h2><form method="post" action="{{ url_for('social_research.ai_topic_configure',feed_id=topic.id) }}">{{ token() }}<input type="hidden" name="expected_revision" value="{{ topic.ai_revision }}"><label for="ai-criteria">重視する観点</label><input id="ai-criteria" name="ai_criteria" maxlength="500" value="{{ topic.ai_criteria }}" placeholder="例：研究の新規性、実用への影響、具体的な根拠"><label class="check"><input type="checkbox" name="ai_enabled" value="1" {{ 'checked' if topic.ai_enabled }}> 定期収集後に自動抽出する</label><button>抽出設定を保存</button><p class="hint">自動抽出は全体・この分野の定期収集が有効な場合に実行します。手動抽出は定期収集停止中も利用できます。非公開案件に関連付いた記事と認証値らしい文字列を含む抜粋は送信対象から除きます。</p></form></section>
