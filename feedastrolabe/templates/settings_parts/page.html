<section class="settings-card" id="pages"><p class="muted small">公開ページの指定箇所を定期的に確認し、テキストの変化を記事として保存します。初回は比較の基準だけを保存します。</p><form method="post" action="{{ url_for('settings.subscribe_page') }}">{{ token() }}<div class="settings-grid"><div><label for="page-url">観測 URL</label><input id="page-url" name="url" type="url" required maxlength="2048" placeholder="https://example.com/news" value="{{ submitted.get('url','') }}"><label for="page-selector">CSS セレクター</label><input id="page-selector" name="selector" required maxlength="500" placeholder="#announcements" value="{{ submitted.get('selector','') }}"><p class="hint">複数要素なら表示順に比較します。ログインが必要なページには対応していません。</p><label for="page-folder">フォルダー</label><input id="page-folder" name="folder" maxlength="80" placeholder="ページ観測" value="{{ submitted.get('folder','') }}"></div><div><label for="page-interval">観測間隔（秒）</label><input id="page-interval" name="poll_interval" type="number" min="60" max="86400" value="{{ submitted.get('poll_interval','900') }}" required><label for="page-settle">描画待機時間（ミリ秒）</label><input id="page-settle" name="settle_ms" type="number" min="0" max="10000" value="{{ submitted.get('settle_ms','1000') }}" required><label for="page-retention">差分記事の保存期間（日）</label><input id="page-retention" name="retention_days" type="number" min="1" max="365" value="{{ submitted.get('retention_days','90') }}" required><p class="hint">期間を過ぎたスターなしの記事は削除します。スター付きの記事と最新の基準は保持します。専用の観測サービスを起動して利用してください。</p></div></div><button class="button">ページ観測を登録</button></form></section>
