<section class="settings-card" id="imports"><h2>購読のインポート・エクスポート</h2><p class="muted small">他の RSS リーダーの OPML を読み込めます。エクスポート対象は RSS の購読のみです。最大 1 MiB・100 フィード。重複した URL は追加しません。内容と重複を確認してから登録できます。記事は定期収集で取得します。</p><form class="opml-form" method="post" enctype="multipart/form-data" action="{{ url_for('settings.import_file') }}">{{ token() }}<label for="opml">OPML ファイル</label><input id="opml" name="opml" type="file" accept=".opml,.xml,text/xml" required><button>インポート内容を確認</button></form><a class="button secondary" href="{{ url_for('settings.export') }}">OPML をダウンロード ↓</a></section>
