<section id="api-keys" class="settings-card"><h2>API キーを発行</h2><p class="muted small">フィードと記事を JSON API で取得できます。権限は必要な範囲に設定してください。</p><form method="post" action="{{ url_for('settings.create_key') }}">{{ token() }}<label for="key-name">キー名</label><input id="key-name" name="name" placeholder="自分のスクリプト" required maxlength="80"><label for="key-scope">権限</label><select id="key-scope" name="scope"><option value="read">読み取りのみ</option><option value="write">読み取り・書き込み</option></select><label for="key-days">有効期間（日）</label><input id="key-days" name="days" type="number" min="1" max="365" value="90" required><button class="button">新しいキーを発行</button></form><p class="hint">GET /api/v1/feeds<br>GET /api/v1/articles<br>Authorization: Bearer &lt;API キー&gt;</p><a class="text-button" href="{{ url_for('static', filename='openapi.json') }}" target="_blank" rel="noopener">OpenAPI 定義を見る ↗</a></section>
