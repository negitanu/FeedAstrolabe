<h2 id="delivery-settings">通知先</h2><p>資格情報と送信先の許可リストは運用者が非公開ファイルで設定します。宛先の追加・有効化だけでは送信しません。</p>{% for p in profiles %}<article class="research-card"><h3>#{{ p.id }} {{ p.name }}</h3><p>{{ p.kind }} · {{ p.destination }}</p><form method="post" action="{{ url_for('operations.profile_update',identifier=p.id) }}">{{ token() }}<input type="hidden" name="expected_revision" value="{{ p.revision }}"><label><input type="checkbox" name="enabled" {{ 'checked' if p.enabled }}>送信先を有効にする</label><button>保存</button></form></article>{% else %}<p>通知先はまだ登録されていません。下のフォームで宛先を追加してください。</p>{% endfor %}
<form method="post" action="{{ url_for('operations.profile') }}">{{ token() }}<label>設定名<input name="name" maxlength="100" required></label><label>方式<select name="kind"><option value="webhook">署名付きWebhook</option><option value="email">メール（TLS）</option></select></label><label>正確な宛先<input name="destination" maxlength="2048" required></label><button>停止状態で追加</button></form>
