{% extends 'research_base.html' %}{% block research_body %}<h1>レポート #{{ report.id }}</h1><p>{{ report.format }} · {{ report.created_at }} UTC · {{ report.payload_hash }}</p><p><a href="{{ url_for('operations.download',identifier=report.id) }}">ファイルをダウンロード</a> · <a href="{{ url_for('operations.index') }}">運用へ戻る</a></p><pre class="evidence-text">{{ report.payload }}</pre><h2>送信内容の確認</h2><form method="post" action="{{ url_for('operations.preview_create',identifier=report.id) }}">{{ token() }}<label>有効な通知先 ID<input name="profile_id" type="number" min="1" required></label><button>送信内容をプレビュー</button></form><p>内部・制限付き選択のレポートは外部送信できません。</p>{% endblock %}
